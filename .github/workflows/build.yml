name: build-windows

# Public build-only runner repo.
# The private source (worldneedme/nbl) is fetched on-demand using a read-only deploy key (SOURCE_READ_KEY).
# Source code is never committed or published here.
# Verified installers and preview releases are published directly to the private worldneedme/nbl repository.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Private nbl commit full SHA (40-char hex)'
        required: true
        type: string
      publish:
        description: 'Publish verified preview release to private nbl repo'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: jeu-studio-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build & Package Windows x64 Native App & Installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Validate source SHA format
        run: |
          $sha = "${{ inputs.source_sha }}".Trim()
          if ($sha -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Invalid source_sha '$sha'. Must be a full 40-character hexadecimal SHA."
          }
          Write-Host "Target private source SHA: $sha"

      - name: Checkout private nbl source
        uses: actions/checkout@v4
        with:
          repository: worldneedme/nbl
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          persist-credentials: false

      - name: Assert exact commit checkout
        run: |
          $checkedOutSha = (git rev-parse HEAD).Trim()
          $expectedSha = "${{ inputs.source_sha }}".Trim()
          Write-Host "Checked out HEAD SHA: $checkedOutSha"
          Write-Host "Expected target SHA:  $expectedSha"
          if ($checkedOutSha -ne $expectedSha) {
            throw "Checkout mismatch! Checked out $checkedOutSha but expected $expectedSha"
          }
          Write-Host "Commit verification successful."

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Standalone FFmpeg Master (Official BtbN Non-Shim)
        uses: AnimMouse/setup-ffmpeg@v1
        with:
          version: master

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Node Unit Tests
        run: |
          Write-Host "Verifying syntax of all ES modules with node --check..."
          Get-ChildItem -Filter "*.mjs" | ForEach-Object {
            Write-Host "  Checking $($_.Name)..."
            node --check $_.FullName
          }
          Write-Host "Testing capture-session.mjs module loading..."
          $captureRes = node capture-session.mjs 2>&1
          if ($captureRes -match "ReferenceError" -or $captureRes -match "SyntaxError") {
            throw "capture-session.mjs failed module loading test: $captureRes"
          }
          Write-Host "  capture-session.mjs module loading verified."

          $testFiles = (Get-ChildItem "test\*.test.mjs").FullName
          if (-not $testFiles) {
            throw "No test files found in test directory!"
          }
          Write-Host "Running $($testFiles.Count) Node unit test files..."
          node --test $testFiles

      - name: Run Go Desktop Unit Tests
        working-directory: desktop
        run: go test -v ./...

      - name: Build Go Desktop Native Binary (JEUStudio.exe)
        working-directory: desktop
        run: |
          go build -ldflags "-s -w -H=windowsgui" -o ../JEUStudio.exe .
          cd ..
          Get-Item JEUStudio.exe | Select-Object Name, Length

      - name: Package Release Bundle with Portable Runtimes & Dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Assembling self-contained release bundle with portable runtimes..."

          # 1. Prepare package directory structure matching installer.iss
          $bundle = "package"
          New-Item -ItemType Directory -Force -Path "$bundle\runtime\node"
          New-Item -ItemType Directory -Force -Path "$bundle\runtime\ffmpeg\bin"
          New-Item -ItemType Directory -Force -Path "$bundle\runtime\python"
          New-Item -ItemType Directory -Force -Path "$bundle\runtime\pyvenv\Scripts"
          New-Item -ItemType Directory -Force -Path "$bundle\nbl"
          New-Item -ItemType Directory -Force -Path "$bundle\data"
          New-Item -ItemType Directory -Force -Path "$bundle\sessions\chrome-profile"
          New-Item -ItemType Directory -Force -Path "$bundle\outputs"

          # 2. Bundle Node 20 runtime executable
          $nodeExe = (Get-Command node).Source
          Copy-Item $nodeExe "$bundle\runtime\node\node.exe"
          Write-Host "  Bundled Node executable: $((Get-Item "$bundle\runtime\node\node.exe").Length) bytes"

          # 3. Bundle standalone FFmpeg & FFprobe (real standalone binaries, not Chocolatey shims)
          $ffmpegExe = (Get-Command ffmpeg).Source
          $ffprobeExe = (Get-Command ffprobe).Source
          Copy-Item $ffmpegExe "$bundle\runtime\ffmpeg\bin\ffmpeg.exe"
          Copy-Item $ffprobeExe "$bundle\runtime\ffmpeg\bin\ffprobe.exe"
          $ffmpegSize = (Get-Item "$bundle\runtime\ffmpeg\bin\ffmpeg.exe").Length
          if ($ffmpegSize -lt 20MB) {
            throw "FFmpeg binary is suspicious (only $ffmpegSize bytes, expected >20MB standalone binary)!"
          }
          Write-Host "  Bundled standalone FFmpeg binary: $ffmpegSize bytes"

          # 4. Bundle standalone Python 3.12 environment with dependencies
          $pyRoot = Split-Path -Parent (Get-Command python).Source
          Copy-Item "$pyRoot\python.exe" "$bundle\runtime\python\python.exe"
          Copy-Item "$pyRoot\python3*.dll" "$bundle\runtime\python\"
          Copy-Item -Recurse "$pyRoot\DLLs" "$bundle\runtime\python\"
          Copy-Item -Recurse "$pyRoot\Lib" "$bundle\runtime\python\"
          Copy-Item "$bundle\runtime\python\python.exe" "$bundle\runtime\pyvenv\Scripts\python.exe"
          & "$bundle\runtime\python\python.exe" -m pip install --no-warn-script-location requests
          Write-Host "  Bundled standalone Python environment with requests verified."

          # 5. Copy desktop shell, scripts, and runtime assets
          Copy-Item "JEUStudio.exe" "$bundle\"
          Copy-Item "STOP_LOCAL.ps1" "$bundle\"
          Copy-Item "config.json" "$bundle\"

          # 6. Copy complete nbl source, scripts, web assets, and node_modules
          $nblFiles = @(
            "package.json", "package-lock.json", "server.mjs", "batch.mjs",
            "profile-utils.mjs", "video-subtitles.mjs", "audio_to_srt.py", "bcut_asr.py", "config.json",
            "archive-utils.mjs", "batch-safety.mjs", "quota-policy.mjs",
            "capture-session.mjs", "browser-session.sh", "run.sh",
            "requirements.txt", "prompts.txt", "README.md", "DEPLOY.md"
          )
          foreach ($f in $nblFiles) {
            if (Test-Path $f) { Copy-Item $f "$bundle\nbl\" -Force }
          }
          if (Test-Path "scripts") {
            Copy-Item -Recurse "scripts" "$bundle\nbl\scripts" -Force
          }
          if (Test-Path "deploy") {
            Copy-Item -Recurse "deploy" "$bundle\nbl\deploy" -Force
          }
          if (Test-Path "public") {
            Copy-Item -Recurse "public" "$bundle\nbl\public" -Force
          }
          Copy-Item -Recurse "node_modules" "$bundle\nbl\node_modules" -Force

          Write-Host "Release bundle packaged successfully into package/."

      - name: Build Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          Move-Item -Path "dist\JEUStudio-Setup-x64.exe" -Destination ".\JEUStudio-Setup-x64.exe" -Force
          Get-Item JEUStudio-Setup-x64.exe | Select-Object Name, Length

      - name: Create Zip Package for Direct Portable Distribution
        run: |
          Compress-Archive -Path "package\*" -DestinationPath "JEUStudio-Windows-x64.zip" -Force
          Get-Item JEUStudio-Windows-x64.zip | Select-Object Name, Length

      - name: Verify Windows Installation to D:\JEU-Studio & Bundled Runtime
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "=========================================="
          Write-Host "Starting Isolated Acceptance Verification:"
          Write-Host "=========================================="

          # Ensure Drive D: is available on GitHub-hosted runner
          if (-not (Test-Path "D:\")) {
            Write-Host "Drive D: not mounted, mapping D: via subst..."
            New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\VirtualDriveD" -Force
            subst D: "$env:RUNNER_TEMP\VirtualDriveD"
          }

          Write-Host "1. Testing silent installer without /DIR parameter..."
          $installProc = Start-Process -FilePath ".\JEUStudio-Setup-x64.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -PassThru -Wait
          if ($installProc.ExitCode -ne 0) {
            throw "Installer failed with exit code: $($installProc.ExitCode)"
          }

          Write-Host "2. Verifying default installation directory: D:\JEU-Studio..."
          if (-not (Test-Path "D:\JEU-Studio")) {
            throw "Installation failed: D:\JEU-Studio does not exist!"
          }

          $requiredFiles = @(
            "D:\JEU-Studio\JEUStudio.exe",
            "D:\JEU-Studio\STOP_LOCAL.ps1",
            "D:\JEU-Studio\runtime\node\node.exe",
            "D:\JEU-Studio\runtime\ffmpeg\bin\ffmpeg.exe",
            "D:\JEU-Studio\runtime\ffmpeg\bin\ffprobe.exe",
            "D:\JEU-Studio\runtime\python\python.exe",
            "D:\JEU-Studio\nbl\server.mjs",
            "D:\JEU-Studio\nbl\profile-utils.mjs",
            "D:\JEU-Studio\nbl\capture-session.mjs",
            "D:\JEU-Studio\nbl\public\index.html"
          )
          foreach ($f in $requiredFiles) {
            if (-not (Test-Path $f)) {
              throw "Required file missing in D:\JEU-Studio: $f"
            }
          }
          Write-Host "All required files verified in D:\JEU-Studio."

          Write-Host "3. Simulating clean Windows environment (stripping runner node/python/ffmpeg from PATH)..."
          $cleanPath = ($env:PATH -split ';' | Where-Object {
            $_ -notmatch 'hostedtoolcache' -and
            $_ -notmatch 'node' -and
            $_ -notmatch 'python' -and
            $_ -notmatch 'chocolatey' -and
            $_ -notmatch 'ffmpeg'
          }) -join ';'
          $env:PATH = $cleanPath

          Write-Host "Verifying runner tools are stripped from PATH:"
          $testNode = Get-Command node -ErrorAction SilentlyContinue
          $testPython = Get-Command python -ErrorAction SilentlyContinue
          $testFFmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          Write-Host "  node on PATH: $($testNode -eq $null)"
          Write-Host "  python on PATH: $($testPython -eq $null)"
          Write-Host "  ffmpeg on PATH: $($testFFmpeg -eq $null)"

          Write-Host "4. Testing bundled isolated runtimes directly..."
          $nodeVer = & "D:\JEU-Studio\runtime\node\node.exe" --version
          Write-Host "  Bundled Node.js: $nodeVer"
          $ffmpegVer = & "D:\JEU-Studio\runtime\ffmpeg\bin\ffmpeg.exe" -version | Select-Object -First 1
          Write-Host "  Bundled FFmpeg: $ffmpegVer"
          $pyVer = & "D:\JEU-Studio\runtime\python\python.exe" --version
          Write-Host "  Bundled Python: $pyVer"

          Write-Host "5. Testing offline audio conversion and Python subtitle FFmpeg resolution..."
          New-Item -ItemType Directory -Force -Path "D:\JEU-Studio\data"
          & "D:\JEU-Studio\runtime\ffmpeg\bin\ffmpeg.exe" -f lavfi -i anullsrc=r=16000:cl=mono -t 1 -y "D:\JEU-Studio\data\test_sample.wav"
          & "D:\JEU-Studio\runtime\ffmpeg\bin\ffmpeg.exe" -i "D:\JEU-Studio\data\test_sample.wav" -y "D:\JEU-Studio\data\test_sample.mp3"
          if (-not (Test-Path "D:\JEU-Studio\data\test_sample.mp3")) {
            throw "FFmpeg audio conversion test failed!"
          }
          Write-Host "  [OK] FFmpeg offline audio conversion verified."

          & "D:\JEU-Studio\runtime\python\python.exe" -c "import sys, os; sys.path.insert(0, r'D:\JEU-Studio\nbl'); import audio_to_srt; f = audio_to_srt.resolve_ffmpeg_bin(); print('Resolved FFmpeg in Python:', f); assert os.path.isfile(f), f'FFmpeg not found: {f}'; assert 'runtime' in f.lower(), 'FFmpeg was not resolved to bundled runtime!'"
          Write-Host "  [OK] Python subtitle script and bundled FFmpeg resolution verified."

          Write-Host "6. Negative tests for STOP_LOCAL.ps1..."
          Write-Host "6A. Negative test: PID reuse / creation time check (real server.mjs on port 9655, stale startedAt)..."
          New-Item -ItemType Directory -Force -Path "D:\JEU-Studio\test-6a"
          # Launch real server.mjs using bundled node on independent test port 9655
          $reusedProc = Start-Process -FilePath "D:\JEU-Studio\runtime\node\node.exe" `
            -ArgumentList "D:\JEU-Studio\nbl\server.mjs" `
            -WorkingDirectory "D:\JEU-Studio\nbl" `
            -Environment @{ NBL_PORT = "9655"; NBL_DATA_DIR = "D:\JEU-Studio\test-6a" } `
            -RedirectStandardError "$env:RUNNER_TEMP\server-6a.err" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\server-6a.out" `
            -PassThru
          Write-Host "  Started real server.mjs on test port 9655 (PID $($reusedProc.Id))"
          Start-Sleep -Seconds 2
          if ($reusedProc.HasExited) {
            Write-Host "  [ERROR] Server exited prematurely! Logs:"
            if (Test-Path "$env:RUNNER_TEMP\server-6a.err") { Get-Content "$env:RUNNER_TEMP\server-6a.err" }
            if (Test-Path "$env:RUNNER_TEMP\server-6a.out") { Get-Content "$env:RUNNER_TEMP\server-6a.out" }
            throw "Failed to start real server.mjs for negative test 6A (PID $($reusedProc.Id) exited prematurely)!"
          }
          $reusedPidInfo = @{
            pid = $reusedProc.Id
            script = "D:\JEU-Studio\nbl\server.mjs"
            startedAt = (Get-Date).AddHours(-2).ToString("o")
          } | ConvertTo-Json
          Set-Content -Path "D:\JEU-Studio\data\local-server.pid.json" -Value $reusedPidInfo -Encoding UTF8
          Write-Host "  Executing STOP_LOCAL.ps1 with stale/reused PID on real server.mjs..."
          & "D:\JEU-Studio\STOP_LOCAL.ps1"
          $checkReused = Get-Process -Id $reusedProc.Id -ErrorAction SilentlyContinue
          if (-not $checkReused -or $reusedProc.HasExited) {
            throw "Negative test 6A failed: real server.mjs process with stale startedAt was terminated by STOP_LOCAL.ps1!"
          }
          if (Test-Path "D:\JEU-Studio\data\local-server.pid.json") {
            throw "Negative test 6A failed: stale PID file was not cleaned up!"
          }
          Write-Host "  [OK] Negative test 6A passed: creation time check protected real process and cleaned stale PID file."
          Stop-Process -Id $reusedProc.Id -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "D:\JEU-Studio\test-6a" -ErrorAction SilentlyContinue

          Write-Host "6B. Negative test: Parameter spoofing (node executing -e with target path in argv, must not stop)..."
          $spoofProc = Start-Process -FilePath "D:\JEU-Studio\runtime\node\node.exe" -ArgumentList "-e `"setInterval(() => {}, 1000)`" `"D:\JEU-Studio\nbl\server.mjs`"" -PassThru
          Write-Host "  Started parameter spoofing dummy process (PID $($spoofProc.Id))"
          $spoofPidInfo = @{
            pid = $spoofProc.Id
            script = "D:\JEU-Studio\nbl\server.mjs"
            startedAt = (Get-Date).ToString("o")
          } | ConvertTo-Json
          Set-Content -Path "D:\JEU-Studio\data\local-server.pid.json" -Value $spoofPidInfo -Encoding UTF8
          Write-Host "  Executing STOP_LOCAL.ps1 against parameter-spoofed process..."
          & "D:\JEU-Studio\STOP_LOCAL.ps1"
          $checkSpoof = Get-Process -Id $spoofProc.Id -ErrorAction SilentlyContinue
          if (-not $checkSpoof -or $spoofProc.HasExited) {
            throw "Negative test 6B failed: parameter-spoofed process was terminated by STOP_LOCAL.ps1!"
          }
          if (Test-Path "D:\JEU-Studio\data\local-server.pid.json") {
            throw "Negative test 6B failed: invalid PID file was not cleaned up!"
          }
          Write-Host "  [OK] Negative test 6B passed: strict script parsing protected parameter-spoofed process and cleaned PID file."
          Stop-Process -Id $spoofProc.Id -Force -ErrorAction SilentlyContinue

          Write-Host "6C. Negative test: Cross-directory server.mjs isolation protection..."
          New-Item -ItemType Directory -Force -Path "C:\OtherApp\nbl"
          Set-Content -Path "C:\OtherApp\nbl\server.mjs" -Value "setInterval(() => {}, 1000);" -Encoding UTF8
          $otherProc = Start-Process -FilePath "D:\JEU-Studio\runtime\node\node.exe" -ArgumentList "C:\OtherApp\nbl\server.mjs" -PassThru
          Write-Host "  Started other installation node server.mjs (PID $($otherProc.Id))"
          $otherPidInfo = @{
            pid = $otherProc.Id
            script = "C:\OtherApp\nbl\server.mjs"
            startedAt = (Get-Date).ToString("o")
          } | ConvertTo-Json
          Set-Content -Path "D:\JEU-Studio\data\local-server.pid.json" -Value $otherPidInfo -Encoding UTF8
          Write-Host "  Executing STOP_LOCAL.ps1 against foreign directory server.mjs..."
          & "D:\JEU-Studio\STOP_LOCAL.ps1"
          $checkOther = Get-Process -Id $otherProc.Id -ErrorAction SilentlyContinue
          if (-not $checkOther -or $otherProc.HasExited) {
            throw "Negative test 6C failed: other directory server.mjs was terminated by STOP_LOCAL.ps1!"
          }
          if (Test-Path "D:\JEU-Studio\data\local-server.pid.json") {
            throw "Negative test 6C failed: foreign PID file was not cleaned up!"
          }
          Write-Host "  [OK] Negative test 6C passed: foreign directory server.mjs survived and PID file cleaned up."
          Stop-Process -Id $otherProc.Id -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\OtherApp" -ErrorAction SilentlyContinue

          Write-Host "7. Setting up local test authentication in webconfig.json..."
          $testPassword = [System.Guid]::NewGuid().ToString("N")
          $webCfg = @{ port = 9527; password = $testPassword } | ConvertTo-Json
          Set-Content -Path "D:\JEU-Studio\data\webconfig.json" -Value $webCfg -Encoding UTF8

          Write-Host "8. Testing desktop app launch and local backend in clean environment..."
          $env:NBL_TEST_BROWSER_STUB = "1"
          $app = Start-Process -FilePath "D:\JEU-Studio\JEUStudio.exe" -ArgumentList "-no-open -port 9733" -PassThru

          Write-Host "Polling /studio/health endpoint..."
          $healthOk = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try {
              $resp = Invoke-RestMethod -Uri "http://127.0.0.1:9733/studio/health" -TimeoutSec 2 -ErrorAction Stop
              if ($resp.ok -eq $true) {
                Write-Host "Studio Health Check: $($resp | ConvertTo-Json -Compress)"
                $healthOk = $true
                break
              }
            } catch {}
          }
          if (-not $healthOk) {
            throw "Studio health check failed at http://127.0.0.1:9733/studio/health"
          }

          Write-Host "9. Polling /api/status until backend is ready, verifying unauthenticated request returns HTTP 401..."
          $unauth401 = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:9733/api/status" -TimeoutSec 2 -ErrorAction Stop
            } catch {
              $statusVal = $_.Exception.Response.StatusCode.value__
              if ($statusVal -eq 401) {
                Write-Host "  [OK] Backend ready and /api/status correctly rejected unauthenticated request with HTTP 401"
                $unauth401 = $true
                break
              } elseif ($statusVal -eq 502) {
                # Reverse proxy waiting for backend server.mjs on 9527 to finish binding
                continue
              } else {
                throw "Unexpected response code from /api/status: $statusVal"
              }
            }
          }
          if (-not $unauth401) {
            throw "Unauthenticated request to /api/status did not return HTTP 401 within timeout!"
          }

          Write-Host "10. Authenticating via /api/login and verifying authenticated /api/status..."
          $loginBody = @{ password = $testPassword } | ConvertTo-Json
          $loginResp = Invoke-RestMethod -Uri "http://127.0.0.1:9733/api/login" -Method Post -Body $loginBody -ContentType "application/json" -TimeoutSec 15
          if (-not $loginResp.ok -or -not $loginResp.token) {
            throw "Login failed to return valid authentication token!"
          }
          Write-Host "  [OK] Login successful and auth token received"

          $apiResp = Invoke-RestMethod -Uri "http://127.0.0.1:9733/api/status" -Headers @{ "x-auth" = $loginResp.token } -TimeoutSec 15
          if ($apiResp.ok -ne $true) {
            throw "Authenticated /api/status did not return ok: true! (Received: $($apiResp | ConvertTo-Json -Compress))"
          }
          Write-Host "  [OK] Authenticated /api/status returned HTTP 200 and ok: true"

          Write-Host "10B. Verifying Issue #3: Safe profile directory resolution & browser login API..."
          Write-Host "  (Note: NBL_TEST_BROWSER_STUB verifies directory resolution, recursive creation and API routing; it does NOT claim real Chrome or Google login completion.)"
          if (-not $apiResp.paths -or -not $apiResp.paths.profileDir) {
            throw "Issue #3 verification failed: /api/status does not contain paths.profileDir!"
          }
          Write-Host "  Reported profileDir: $($apiResp.paths.profileDir)"
          if ($apiResp.paths.profileDir -ne "D:\JEU-Studio\sessions\chrome-profile") {
            throw "Issue #3 verification failed: profileDir is '$($apiResp.paths.profileDir)', expected 'D:\JEU-Studio\sessions\chrome-profile'!"
          }

          # Ensure isolated test profile and parent directory do NOT exist before calling browser/start
          # to strictly verify that recursive creation succeeds without ENOENT
          if (Test-Path "D:\JEU-Studio\sessions") {
            Remove-Item -Recurse -Force "D:\JEU-Studio\sessions"
          }
          if (Test-Path "D:\JEU-Studio\sessions") {
            throw "Failed to clean sessions parent directory before test!"
          }
          Write-Host "  [Verified] Parent directory 'D:\JEU-Studio\sessions' confirmed non-existent prior to launch."

          # Test /api/browser/start execution without ENOENT
          $browserStartResp = Invoke-RestMethod -Uri "http://127.0.0.1:9733/api/browser/start" -Method Post -Headers @{ "x-auth" = $loginResp.token } -TimeoutSec 15
          if (-not $browserStartResp.ok) {
            throw "Issue #3 verification failed: /api/browser/start failed with error: $($browserStartResp.error)"
          }
          if (-not (Test-Path "D:\JEU-Studio\sessions\chrome-profile")) {
            throw "Issue #3 verification failed: /api/browser/start did not create D:\JEU-Studio\sessions\chrome-profile!"
          }
          Write-Host "  [OK] /api/browser/start safely created profile and parent directories without ENOENT: $($browserStartResp | ConvertTo-Json -Compress)"

          # Test data preservation: write canary file to profile directory
          $canaryPath = "D:\JEU-Studio\sessions\chrome-profile\canary.txt"
          Set-Content -Path $canaryPath -Value "JEU_STUDIO_CANARY_TEST_123" -Encoding UTF8
          $canaryHashBefore = (Get-FileHash $canaryPath -Algorithm SHA256).Hash

          # Call start again (idempotent call)
          $browserStartAgain = Invoke-RestMethod -Uri "http://127.0.0.1:9733/api/browser/start" -Method Post -Headers @{ "x-auth" = $loginResp.token } -TimeoutSec 15
          if (-not $browserStartAgain.ok) {
            throw "Issue #3 verification failed: idempotent /api/browser/start failed!"
          }
          $canaryHashAfter = (Get-FileHash $canaryPath -Algorithm SHA256).Hash
          if ($canaryHashBefore -ne $canaryHashAfter) {
            throw "Issue #3 verification failed: canary file in profile directory was corrupted or overwritten!"
          }
          Write-Host "  [OK] Profile directory data preservation verified (canary hash intact: $canaryHashAfter)"

          # Call stop
          $browserStopResp = Invoke-RestMethod -Uri "http://127.0.0.1:9733/api/browser/stop" -Method Post -Headers @{ "x-auth" = $loginResp.token } -TimeoutSec 15
          Write-Host "  [OK] /api/browser/stop succeeded: $($browserStopResp | ConvertTo-Json -Compress)"

          Write-Host "Verifying auto-generated data/config.json..."
          if (-not (Test-Path "D:\JEU-Studio\data\config.json")) {
            throw "Safe config initialization failed: D:\JEU-Studio\data\config.json does not exist!"
          }
          Write-Host "  [OK] D:\JEU-Studio\data\config.json initialized."

          Write-Host "11. Positive test: stopping verified JEU Studio service with STOP_LOCAL.ps1..."
          $backendPid = $null
          if (Test-Path "D:\JEU-Studio\data\local-server.pid.json") {
            try {
              $pidInfo = Get-Content "D:\JEU-Studio\data\local-server.pid.json" -Raw | ConvertFrom-Json
              $backendPid = [int]$pidInfo.pid
              Write-Host "  Recorded running backend PID: $backendPid"
            } catch {}
          }

          & "D:\JEU-Studio\STOP_LOCAL.ps1"
          Start-Sleep -Seconds 2

          # Verify backend process has exited
          if ($backendPid -gt 0) {
            $checkBackend = Get-Process -Id $backendPid -ErrorAction SilentlyContinue
            if ($checkBackend -and -not $checkBackend.HasExited) {
              throw "Positive test failed: backend process PID $backendPid is still running!"
            }
            Write-Host "  [OK] Backend process PID $backendPid confirmed terminated."
          }

          # Verify port 9527 is no longer listening
          $portCheck = netstat -ano | Select-String "127.0.0.1:9527" | Select-String "LISTENING"
          if ($portCheck) {
            throw "Positive test failed: port 9527 is still in LISTENING state!"
          }
          Write-Host "  [OK] Port 9527 confirmed closed."

          # Verify HTTP request connection fails (and explicitly reject 401 or 200)
          try {
            $resp = Invoke-RestMethod -Uri "http://127.0.0.1:9527/api/status" -TimeoutSec 2 -ErrorAction Stop
            throw "Positive test failed: backend still returned HTTP response ($($resp | ConvertTo-Json -Compress))"
          } catch {
            $statusCode = $_.Exception.Response.StatusCode.value__
            if ($statusCode -eq 401 -or $statusCode -eq 200) {
              throw "Positive test failed: backend returned HTTP $statusCode, indicating service is still running!"
            }
            Write-Host "  [OK] Connection to port 9527 refused as expected ($($_.Exception.Message))."
          }
          Write-Host "  [OK] Positive test passed: JEU Studio backend service successfully stopped and confirmed dead."

          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Write-Host "Windows native installation, health check, proxy route and shutdown verification successful!"

          Write-Host "12. Integration Verification: Dev Repository Layout (D:\code\projects\nbl) & Clean Environment Path Isolation..."
          $devRoot = "D:\code\projects\nbl"
          if (Test-Path $devRoot) {
            Remove-Item -Recurse -Force $devRoot
          }
          New-Item -ItemType Directory -Path $devRoot -Force | Out-Null

          # Copy repo files into dev directory (without parent runtime or JEUStudio.exe)
          Copy-Item -Path "D:\JEU-Studio\nbl\*" -Destination $devRoot -Recurse -Force
          Copy-Item -Path "D:\JEU-Studio\STOP_LOCAL.ps1" -Destination $devRoot -Force

          # Clean any lingering sessions in devRoot
          if (Test-Path "$devRoot\sessions") {
            Remove-Item -Recurse -Force "$devRoot\sessions"
          }

          # Launch node server.mjs directly in devRoot with clean environment (NO NBL_* env vars)
          $devNodeBin = "D:\JEU-Studio\runtime\node\node.exe"
          $devProc = Start-Process -FilePath $devNodeBin -ArgumentList "server.mjs" -WorkingDirectory $devRoot -Environment @{
            PATH = "D:\JEU-Studio\runtime\node;D:\JEU-Studio\runtime\ffmpeg\bin;$env:SystemRoot\System32"
            NBL_PORT = "9527"
            NBL_TEST_BROWSER_STUB = "1"
          } -PassThru

          Write-Host "  Dev server process started with PID: $($devProc.Id)"

          # Wait for backend to be listening on 9527
          $devReady = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try {
              $testReq = Invoke-WebRequest -Uri "http://127.0.0.1:9527/api/status" -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop
              $devReady = $true
              break
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 401) {
                $devReady = $true
                break
              }
            }
          }
          if (-not $devReady) {
            throw "Dev server in $devRoot failed to bind port 9527 within timeout!"
          }

          # Inspect running process details (PID, command line, working directory)
          $devCim = Get-CimInstance Win32_Process -Filter "ProcessId = $($devProc.Id)"
          Write-Host "  Dev Process ID:          $($devCim.ProcessId)"
          Write-Host "  Dev Process CommandLine: $($devCim.CommandLine)"
          Write-Host "  Dev Working Directory:   $devRoot"

          # 12A. Check HTTP response headers on 9527
          $devHeadReq = $null
          try {
            $devHeadReq = Invoke-WebRequest -Uri "http://127.0.0.1:9527/api/status" -SkipHttpErrorCheck -TimeoutSec 5
          } catch {
            $devHeadReq = $_.Exception.Response
          }
          $headerRoot = if ($devHeadReq.Headers['X-JEU-Studio-Root']) { "$($devHeadReq.Headers['X-JEU-Studio-Root'])" } else { "" }
          $headerProfile = if ($devHeadReq.Headers['X-JEU-Studio-Profile']) { "$($devHeadReq.Headers['X-JEU-Studio-Profile'])" } else { "" }
          $headerVersion = if ($devHeadReq.Headers['X-JEU-Studio-Version']) { "$($devHeadReq.Headers['X-JEU-Studio-Version'])" } else { "" }
          Write-Host "  Dev Response X-JEU-Studio-Root:    $headerRoot"
          Write-Host "  Dev Response X-JEU-Studio-Profile: $headerProfile"
          Write-Host "  Dev Response X-JEU-Studio-Version: $headerVersion"

          if ([System.IO.Path]::GetFullPath($headerRoot) -ne [System.IO.Path]::GetFullPath($devRoot)) {
            throw "Dev verification failed: X-JEU-Studio-Root is '$headerRoot', expected '$devRoot'!"
          }
          if ([System.IO.Path]::GetFullPath($headerProfile) -ne [System.IO.Path]::GetFullPath("$devRoot\sessions\chrome-profile")) {
            throw "Dev verification failed: X-JEU-Studio-Profile is '$headerProfile', expected '$devRoot\sessions\chrome-profile'!"
          }
          if ($headerProfile -match '\.notebooklm') {
            throw "Dev verification failed: X-JEU-Studio-Profile fell back to .notebooklm!"
          }

          # 12B. Read auto-generated dev webconfig.json and authenticate
          $devWebCfgFile = "$devRoot\webconfig.json"
          if (-not (Test-Path $devWebCfgFile)) {
            $devWebCfgFile = "$devRoot\data\webconfig.json"
          }
          if (-not (Test-Path $devWebCfgFile)) {
            throw "Dev verification failed: webconfig.json was not created in $devRoot!"
          }
          $devWebCfg = Get-Content $devWebCfgFile -Raw | ConvertFrom-Json
          $devPassword = $devWebCfg.password
          Write-Host "  Dev web console password auto-generated successfully."

          $devLoginBody = @{ password = $devPassword } | ConvertTo-Json
          $devLoginResp = Invoke-RestMethod -Uri "http://127.0.0.1:9527/api/login" -Method Post -Body $devLoginBody -ContentType "application/json" -TimeoutSec 15
          if (-not $devLoginResp.ok -or -not $devLoginResp.token) {
            throw "Dev login failed to return token!"
          }
          $devToken = $devLoginResp.token

          # 12C. Query authenticated /api/status.paths
          $devStatusResp = Invoke-RestMethod -Uri "http://127.0.0.1:9527/api/status" -Headers @{ "x-auth" = $devToken } -TimeoutSec 15
          $paths = $devStatusResp.paths
          Write-Host "  Dev paths.root:        $($paths.root)"
          Write-Host "  Dev paths.homeDir:     $($paths.homeDir)"
          Write-Host "  Dev paths.profileDir:  $($paths.profileDir)"
          Write-Host "  Dev paths.sessionFile: $($paths.sessionFile)"

          if ([System.IO.Path]::GetFullPath($paths.root) -ne [System.IO.Path]::GetFullPath($devRoot)) {
            throw "Dev verification failed: paths.root is '$($paths.root)', expected '$devRoot'!"
          }
          if ([System.IO.Path]::GetFullPath($paths.homeDir) -ne [System.IO.Path]::GetFullPath("$devRoot\sessions")) {
            throw "Dev verification failed: paths.homeDir is '$($paths.homeDir)', expected '$devRoot\sessions'!"
          }
          if ([System.IO.Path]::GetFullPath($paths.profileDir) -ne [System.IO.Path]::GetFullPath("$devRoot\sessions\chrome-profile")) {
            throw "Dev verification failed: paths.profileDir is '$($paths.profileDir)', expected '$devRoot\sessions\chrome-profile'!"
          }
          if ([System.IO.Path]::GetFullPath($paths.sessionFile) -ne [System.IO.Path]::GetFullPath("$devRoot\sessions\session.json")) {
            throw "Dev verification failed: paths.sessionFile is '$($paths.sessionFile)', expected '$devRoot\sessions\session.json'!"
          }
          foreach ($p in @($paths.root, $paths.homeDir, $paths.profileDir, $paths.sessionFile)) {
            if ($p -match '\.notebooklm') {
              throw "Dev verification failed: path '$p' contains .notebooklm fallback!"
            }
          }

          # 12D. Verify /api/browser/start recursive creation and JSON response in dev layout
          # Assert parent directory does not exist prior to call
          if (Test-Path "$devRoot\sessions") {
            Remove-Item -Recurse -Force "$devRoot\sessions"
          }
          if (Test-Path "$devRoot\sessions") {
            throw "Failed to clean dev sessions before test!"
          }

          $devBrowserStart = Invoke-RestMethod -Uri "http://127.0.0.1:9527/api/browser/start" -Method Post -Headers @{ "x-auth" = $devToken } -TimeoutSec 15
          if (-not $devBrowserStart.ok) {
            throw "Dev /api/browser/start failed: $($devBrowserStart.error)"
          }
          if (-not (Test-Path "$devRoot\sessions\chrome-profile")) {
            throw "Dev /api/browser/start did not create '$devRoot\sessions\chrome-profile'!"
          }
          Write-Host "  [OK] Dev /api/browser/start safely created profile directory without ENOENT: $($devBrowserStart | ConvertTo-Json -Compress)"

          # 12E. Integration test: Caller behavior when port 9527 is occupied by foreign dev backend (D:\code\projects\nbl)
          Write-Host "  --- 12E. Testing installer startup against foreign dev backend on 9527 ---"
          Write-Host "  Current dev process PID: $($devProc.Id)"
          Write-Host "  Current dev process CommandLine: $($devCim.CommandLine)"
          Write-Host "  Current dev X-JEU-Studio-Root: $headerRoot"
          Write-Host "  Current dev paths.root: $($paths.root)"
          Write-Host "  Current dev paths.homeDir: $($paths.homeDir)"
          Write-Host "  Current dev paths.profileDir: $($paths.profileDir)"
          Write-Host "  Current dev paths.sessionFile: $($paths.sessionFile)"

          # Launch D:\JEU-Studio\JEUStudio.exe (installer directory).
          # It must detect that 9527 is occupied by foreign root ($devRoot), refuse to reuse, NOT kill dev process, and set backendReady=false.
          $installerStudioApp = Start-Process -FilePath "D:\JEU-Studio\JEUStudio.exe" -ArgumentList "--no-open","--port","9735" -WorkingDirectory "D:\JEU-Studio" -PassThru
          Write-Host "  Installer JEUStudio.exe started with PID: $($installerStudioApp.Id) on port 9735"

          # Wait for JEUStudio.exe to start its desktop HTTP server on 9735
          $installerReady = $false
          for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 1
            try {
              $chk = Invoke-RestMethod -Uri "http://127.0.0.1:9735/studio/health" -TimeoutSec 2 -ErrorAction Stop
              $installerReady = $true
              break
            } catch {}
          }
          if (-not $installerReady) {
            Stop-Process -Id $installerStudioApp.Id -Force -ErrorAction SilentlyContinue
            throw "Installer JEUStudio.exe failed to start desktop HTTP server on port 9735!"
          }

          # 1. Assert /studio/health: ok=false, backendReady=false, localStatus reports foreign directory mismatch
          $installerHealth = Invoke-RestMethod -Uri "http://127.0.0.1:9735/studio/health" -TimeoutSec 5
          Write-Host "  Installer /studio/health response: $($installerHealth | ConvertTo-Json -Compress)"
          if ($installerHealth.ok -ne $false) {
            Stop-Process -Id $installerStudioApp.Id -Force -ErrorAction SilentlyContinue
            throw "Foreign occupation test failed: /studio/health.ok must be false, got: $($installerHealth.ok)"
          }
          if ($installerHealth.backendReady -ne $false) {
            Stop-Process -Id $installerStudioApp.Id -Force -ErrorAction SilentlyContinue
            throw "Foreign occupation test failed: /studio/health.backendReady must be false, got: $($installerHealth.backendReady)"
          }
          if ($installerHealth.localStatus -notmatch "另一目录" -or $installerHealth.localStatus -notmatch [regex]::Escape($devRoot)) {
            Stop-Process -Id $installerStudioApp.Id -Force -ErrorAction SilentlyContinue
            throw "Foreign occupation test failed: localStatus must report foreign directory mismatch with $devRoot! Got: $($installerHealth.localStatus)"
          }
          Write-Host "  [OK] /studio/health correctly reported ok=false, backendReady=false, and foreign directory mismatch."

          # 2. Assert /api/* returns HTTP 503 and ok=false without calling upstream
          $apiCheckPassed = $false
          try {
            $apiResp = Invoke-WebRequest -Uri "http://127.0.0.1:9735/api/status" -SkipHttpErrorCheck -TimeoutSec 5
            Write-Host "  Installer /api/status HTTP status: $($apiResp.StatusCode)"
            Write-Host "  Installer /api/status response:    $($apiResp.Content)"
            if ($apiResp.StatusCode -eq 503) {
              $apiJson = $apiResp.Content | ConvertFrom-Json
              if ($apiJson.ok -eq $false -and $apiJson.error -match "另一目录") {
                $apiCheckPassed = $true
              }
            }
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -eq 503) {
              $apiCheckPassed = $true
            }
          }
          if (-not $apiCheckPassed) {
            Stop-Process -Id $installerStudioApp.Id -Force -ErrorAction SilentlyContinue
            throw "Foreign occupation test failed: /api/status must return HTTP 503 with JSON ok=false error!"
          }
          Write-Host "  [OK] /api/* correctly returned HTTP 503 Service Unavailable with JSON error diagnosis."

          # 3. Assert external dev process ($devProc.Id) was NOT killed and remains healthy
          $checkDevProc = Get-Process -Id $devProc.Id -ErrorAction SilentlyContinue
          if (-not $checkDevProc -or $checkDevProc.HasExited) {
            Stop-Process -Id $installerStudioApp.Id -Force -ErrorAction SilentlyContinue
            throw "Foreign occupation test failed: external dev process PID $($devProc.Id) was killed or stopped!"
          }
          Write-Host "  [OK] External dev process PID $($devProc.Id) is alive and was NOT killed."

          # Verify external dev backend on 9527 is still responding normally
          $devStillAlive = Invoke-RestMethod -Uri "http://127.0.0.1:9527/api/status" -Headers @{ "x-auth" = $devToken } -TimeoutSec 5
          if ($devStillAlive.paths.root -ne $devRoot) {
            Stop-Process -Id $installerStudioApp.Id -Force -ErrorAction SilentlyContinue
            throw "Foreign occupation test failed: dev backend on 9527 was corrupted or not responding!"
          }
          Write-Host "  [OK] Dev backend on 9527 remains fully operational and responsive."

          # Clean up installer test app
          Stop-Process -Id $installerStudioApp.Id -Force -ErrorAction SilentlyContinue

          # 12F. Integration test: Caller behavior for same-directory safe reuse
          Write-Host "  --- 12F. Testing same-directory launcher safe reuse ---"
          Copy-Item -Path "D:\JEU-Studio\JEUStudio.exe" -Destination "$devRoot\JEUStudio.exe" -Force
          $devStudioApp = Start-Process -FilePath "$devRoot\JEUStudio.exe" -ArgumentList "--no-open","--port","9736" -WorkingDirectory $devRoot -PassThru
          Write-Host "  Same-directory JEUStudio.exe started with PID: $($devStudioApp.Id) on port 9736"

          $devStudioReady = $false
          for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 1
            try {
              $chk = Invoke-RestMethod -Uri "http://127.0.0.1:9736/studio/health" -TimeoutSec 2 -ErrorAction Stop
              $devStudioReady = $true
              break
            } catch {}
          }
          if (-not $devStudioReady) {
            Stop-Process -Id $devStudioApp.Id -Force -ErrorAction SilentlyContinue
            throw "Same-directory JEUStudio.exe failed to start desktop HTTP server on port 9736!"
          }

          # Assert same-directory /studio/health: ok=true, backendReady=true, localStatus="现有本机 NBL 服务已运行"
          $sameHealth = Invoke-RestMethod -Uri "http://127.0.0.1:9736/studio/health" -TimeoutSec 5
          Write-Host "  Same-directory /studio/health response: $($sameHealth | ConvertTo-Json -Compress)"
          if ($sameHealth.ok -ne $true) {
            Stop-Process -Id $devStudioApp.Id -Force -ErrorAction SilentlyContinue
            throw "Same-directory reuse test failed: /studio/health.ok must be true, got: $($sameHealth.ok)"
          }
          if ($sameHealth.backendReady -ne $true) {
            Stop-Process -Id $devStudioApp.Id -Force -ErrorAction SilentlyContinue
            throw "Same-directory reuse test failed: /studio/health.backendReady must be true, got: $($sameHealth.backendReady)"
          }
          if ($sameHealth.localStatus -ne "现有本机 NBL 服务已运行") {
            Stop-Process -Id $devStudioApp.Id -Force -ErrorAction SilentlyContinue
            throw "Same-directory reuse test failed: localStatus must be '现有本机 NBL 服务已运行', got: $($sameHealth.localStatus)"
          }
          Write-Host "  [OK] Same-directory service successfully recognized as reusable (ok=true, backendReady=true)."

          # Assert same-directory /api/status proxies through (returns 401 without auth token, confirming proxy forwarding)
          $proxyThrough = $false
          try {
            $sameApiReq = Invoke-WebRequest -Uri "http://127.0.0.1:9736/api/status" -SkipHttpErrorCheck -TimeoutSec 5
            Write-Host "  Same-directory /api/status HTTP status: $($sameApiReq.StatusCode)"
            if ($sameApiReq.StatusCode -eq 401) {
              $proxyThrough = $true
            }
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -eq 401) {
              $proxyThrough = $true
            }
          }
          if (-not $proxyThrough) {
            Stop-Process -Id $devStudioApp.Id -Force -ErrorAction SilentlyContinue
            throw "Same-directory reuse test failed: /api/status did not forward to backend (expected HTTP 401)!"
          }
          Write-Host "  [OK] Same-directory proxy correctly forwards requests to the running backend."

          # Clean up same-directory launcher
          Stop-Process -Id $devStudioApp.Id -Force -ErrorAction SilentlyContinue

          # 12G. Stop dev backend cleanly with STOP_LOCAL.ps1
          Write-Host "  --- 12G. Stopping dev backend with STOP_LOCAL.ps1 ---"
          & "$devRoot\STOP_LOCAL.ps1"
          Start-Sleep -Seconds 2
          if (-not $devProc.HasExited) {
            Stop-Process -Id $devProc.Id -Force -ErrorAction SilentlyContinue
          }
          Write-Host "  [OK] Dev repository verification completed successfully and cleanly."

      - name: Calculate Checksums for Installer and Portable Zip
        run: |
          $setupHash = (Get-FileHash JEUStudio-Setup-x64.exe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash JEUStudio-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          $sourceSha = "${{ inputs.source_sha }}".Trim()

          Write-Host "=========================================="
          Write-Host "Source Commit SHA: $sourceSha"
          Write-Host "JEUStudio-Setup-x64.exe SHA256: $setupHash"
          Write-Host "JEUStudio-Windows-x64.zip SHA256: $zipHash"
          Write-Host "=========================================="

          $checksumContent = "Source-Commit: $sourceSha`nJEUStudio-Setup-x64.exe: $setupHash`nJEUStudio-Windows-x64.zip: $zipHash"
          Set-Content -Path "checksums.txt" -Value $checksumContent -Encoding UTF8

      - name: Deliver Preview Release to Private Source Repo (worldneedme/nbl)
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.NBL_RELEASES_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            Write-Warning "NBL_RELEASES_TOKEN secret not configured; skipping private release publication."
            exit 0
          }
          $sourceSha = "${{ inputs.source_sha }}".Trim()
          $shortSha = $sourceSha.Substring(0, 7)
          $tag = "preview-$shortSha"
          $setupHash = (Get-FileHash JEUStudio-Setup-x64.exe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash JEUStudio-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()

          Write-Host "Publishing preview release $tag to private repository worldneedme/nbl..."
          gh release delete $tag --repo worldneedme/nbl --yes 2>$null
          gh release create $tag JEUStudio-Setup-x64.exe JEUStudio-Windows-x64.zip checksums.txt `
            --repo worldneedme/nbl `
            --target $sourceSha `
            --title "JEU Studio Preview ($shortSha)" `
            --notes "Automated Windows x64 build and verification for commit $sourceSha`n`nBuilt by worldneedme/jeu-studio-build run ${{ github.run_id }}`n`nSHA256 Checksums:`n- JEUStudio-Setup-x64.exe: $setupHash`n- JEUStudio-Windows-x64.zip: $zipHash" `
            --prerelease
          Write-Host "Preview release successfully published to private repo: https://github.com/worldneedme/nbl/releases/tag/$tag"
