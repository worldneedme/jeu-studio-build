name: Batch resume Windows diagnostic

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Private nbl source commit (full 40-character SHA)
        required: true
        type: string

permissions:
  contents: read

jobs:
  batch-resume:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Validate source SHA
        shell: pwsh
        run: |
          if ('${{ inputs.source_sha }}' -notmatch '^[0-9a-fA-F]{40}$') { throw 'Invalid source SHA' }
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: worldneedme/nbl
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          persist-credentials: false
      - name: Verify exact source and install dependencies
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne '${{ inputs.source_sha }}') { throw 'Source SHA mismatch' }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run worker restart and archive replay tests
        run: node --test test/batch-resume.test.mjs
