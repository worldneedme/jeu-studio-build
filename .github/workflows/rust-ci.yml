name: Rust Windows Native Foundation CI

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Target private nbl commit SHA'
        required: true
        type: string

jobs:
  rust-windows:
    name: Rust Windows x64 Native Foundation
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Validate source SHA format
        run: |
          $sha = "${{ inputs.source_sha }}".Trim()
          if ($sha -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Invalid source_sha '$sha'. Must be a full 40-character hexadecimal SHA."
          }
          Write-Host "Target private source SHA: $sha"

      - name: Checkout private nbl source
        uses: actions/checkout@v4
        with:
          repository: worldneedme/nbl
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          persist-credentials: false

      - name: Assert exact commit checkout
        run: |
          $checkedOutSha = (git rev-parse HEAD).Trim()
          $expectedSha = "${{ inputs.source_sha }}".Trim()
          Write-Host "Checked out HEAD SHA: $checkedOutSha"
          Write-Host "Expected target SHA:  $expectedSha"
          if ($checkedOutSha -ne $expectedSha) {
            throw "Checkout mismatch! Checked out $checkedOutSha but expected $expectedSha"
          }

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: |
          npm ci --ignore-scripts

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Verify Formatting (cargo fmt --check)
        run: |
          Write-Host "Running cargo fmt --check..."
          cargo fmt --check --manifest-path rust/Cargo.toml

      - name: Verify Cargo.lock exists
        run: |
          if (-not (Test-Path "rust/Cargo.lock")) {
            throw "Expected rust/Cargo.lock in checkout, but not found!"
          }
          Write-Host "Verified rust/Cargo.lock exists in checkout."

      - name: Run Unit & Integration Tests (cargo test --locked)
        run: |
          Write-Host "Running cargo test on x86_64-pc-windows-msvc..."
          cargo test --locked --manifest-path rust/Cargo.toml --target x86_64-pc-windows-msvc -- --nocapture

      - name: Build Release Binary (cargo build --locked --release)
        run: |
          Write-Host "Compiling release binary..."
          cargo build --locked --release --manifest-path rust/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Verify Executable & Compute Checksum
        id: checksum
        run: |
          $exePath = "rust/target/x86_64-pc-windows-msvc/release/jeu-studio-native.exe"
          if (-not (Test-Path $exePath)) {
            throw "Expected executable not found at $exePath!"
          }
          $item = Get-Item $exePath
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLower()
          Write-Host "=========================================="
          Write-Host "Executable: $($item.FullName)"
          Write-Host "Size:       $($item.Length) bytes"
          Write-Host "SHA256:     $hash"
          Write-Host "=========================================="
          echo "exe_hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Smoke Test UI, Guarded Proxy & Exit on Windows
        run: |
          $exePath = (Resolve-Path "rust/target/x86_64-pc-windows-msvc/release/jeu-studio-native.exe").Path
          $testPort = 9877
          $backendPort = 9888
          $testRoot = Join-Path $env:RUNNER_TEMP "jeu-r2a-smoke-test"
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null

          function Get-HttpStatusAndBody($uri, $headers = @{}, $method = "GET") {
            try {
              $r = Invoke-WebRequest -Uri $uri -Method $method -Headers $headers -SkipHttpErrorCheck -TimeoutSec 3
              return @{ StatusCode = [int]$r.StatusCode; Content = $r.Content; Headers = $r.Headers }
            } catch {
              $code = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode.value__ } else { 0 }
              $body = ""
              if ($_.Exception.Response) {
                $stream = $_.Exception.Response.GetResponseStream()
                if ($stream) {
                  $reader = New-Object System.IO.StreamReader($stream)
                  $body = $reader.ReadToEnd()
                }
              }
              return @{ StatusCode = $code; Content = $body; Headers = @{} }
            }
          }

          Write-Host "1. Launching jeu-studio-native.exe on 127.0.0.1:$testPort with injected backend port $backendPort..."
          $proc = Start-Process -FilePath $exePath `
            -ArgumentList "--port", "$testPort", "--backend-port", "$backendPort", "--no-backend", "--no-open", "--root", "$testRoot" `
            -PassThru

          Write-Host "  Started PID: $($proc.Id)"
          Start-Sleep -Seconds 2

          if ($proc.HasExited) {
            throw "Executable exited unexpectedly with code $($proc.ExitCode)!"
          }

          Write-Host "2. Probing Static UI assets (/, /app.css, /app.js) with no-store and CSP..."
          $uiResp = Invoke-WebRequest -Uri "http://127.0.0.1:$testPort/" -TimeoutSec 3 -ErrorAction Stop
          if ($uiResp.StatusCode -ne 200 -or -not ($uiResp.Content -like "*JEU Studio*")) {
            throw "Failed loading root UI /: StatusCode $($uiResp.StatusCode)"
          }
          if ($uiResp.Headers["Cache-Control"] -notlike "*no-store*") {
            throw "Missing Cache-Control: no-store on root UI"
          }
          if (-not $uiResp.Headers.ContainsKey("Content-Security-Policy")) {
            throw "Missing Content-Security-Policy on UI response"
          }
          Write-Host "  [OK] / loaded with 200 OK, JEU Studio title, no-store, and CSP."

          $cssResp = Invoke-WebRequest -Uri "http://127.0.0.1:$testPort/app.css" -TimeoutSec 3 -ErrorAction Stop
          if ($cssResp.StatusCode -ne 200 -or $cssResp.Headers["Content-Type"] -notlike "*text/css*") {
            throw "Failed loading /app.css: StatusCode $($cssResp.StatusCode)"
          }
          if ($cssResp.Headers["Cache-Control"] -notlike "*no-store*") {
            throw "Missing Cache-Control: no-store on /app.css"
          }
          Write-Host "  [OK] /app.css loaded with 200 OK, text/css, and no-store."

          $jsResp = Invoke-WebRequest -Uri "http://127.0.0.1:$testPort/app.js" -TimeoutSec 3 -ErrorAction Stop
          if ($jsResp.StatusCode -ne 200 -or $jsResp.Headers["Content-Type"] -notlike "*javascript*") {
            throw "Failed loading /app.js: StatusCode $($jsResp.StatusCode)"
          }
          if ($jsResp.Headers["Cache-Control"] -notlike "*no-store*") {
            throw "Missing Cache-Control: no-store on /app.js"
          }
          Write-Host "  [OK] /app.js loaded with 200 OK, javascript, and no-store."

          Write-Host "3. Verifying Unready Backend state (port $backendPort not listening)..."
          $healthData = Invoke-RestMethod -Uri "http://127.0.0.1:$testPort/studio/health" -TimeoutSec 3 -ErrorAction Stop
          if ($healthData.ok -ne $false -or $healthData.backendReady -ne $false) {
            throw "Assertion failed: health must indicate backendReady: false when backend is down!"
          }
          Write-Host "  [OK] /studio/health reports backendReady: false, localStatus: $($healthData.localStatus)"

          $apiBlocked = Get-HttpStatusAndBody "http://127.0.0.1:$testPort/api/status"
          if ($apiBlocked.StatusCode -ne 503) {
            throw "Expected HTTP 503 on unready /api/status, got $($apiBlocked.StatusCode)"
          }
          Write-Host "  [OK] /api/status blocked with HTTP 503 when backend is down."

          Write-Host "4. Starting controllable local mock backend on 127.0.0.1:$backendPort..."
          $pyCode = @(
            'from http.server import HTTPServer, BaseHTTPRequestHandler',
            'import sys',
            'default_root = sys.argv[1]',
            'port = int(sys.argv[2])',
            'state = {',
            '    "root": default_root,',
            '    "code": 200,',
            '    "biz_count": 0,',
            '}',
            'class Handler(BaseHTTPRequestHandler):',
            '    def do_GET(self):',
            '        if self.path == "/mock/set-401":',
            '            state["code"] = 401',
            '            state["root"] = default_root',
            '            self.send_response(200)',
            '            self.end_headers()',
            '            self.wfile.write(b"ok")',
            '            return',
            '        if self.path == "/mock/set-200":',
            '            state["code"] = 200',
            '            state["root"] = default_root',
            '            self.send_response(200)',
            '            self.end_headers()',
            '            self.wfile.write(b"ok")',
            '            return',
            '        if self.path == "/mock/set-foreign-root":',
            '            state["root"] = "C:\\Foreign-Path"',
            '            self.send_response(200)',
            '            self.end_headers()',
            '            self.wfile.write(b"ok")',
            '            return',
            '        if self.path == "/mock/set-missing-root":',
            '            state["root"] = None',
            '            self.send_response(200)',
            '            self.end_headers()',
            '            self.wfile.write(b"ok")',
            '            return',
            '        if self.path == "/mock/biz-count":',
            '            self.send_response(200)',
            '            self.end_headers()',
            '            self.wfile.write(str(state["biz_count"]).encode())',
            '            return',
            '        if self.path != "/api/status":',
            '            state["biz_count"] += 1',
            '        code = state["code"]',
            '        self.send_response(code)',
            '        self.send_header("Content-Type", "application/json")',
            '        self.send_header("Cache-Control", "no-store")',
            '        if state["root"] is not None:',
            '            self.send_header("X-JEU-Studio-Root", state["root"])',
            '        self.end_headers()',
            '        if code == 401:',
            '            self.wfile.write(b''{"authenticated":false,"status":"unauthorized"}'')',
            '        else:',
            '            self.wfile.write(b''{"authenticated":true,"status":"ready"}'')',
            '    def do_POST(self):',
            '        state["biz_count"] += 1',
            '        self.send_response(200)',
            '        self.send_header("Content-Type", "application/json")',
            '        self.send_header("Cache-Control", "no-store")',
            '        if state["root"] is not None:',
            '            self.send_header("X-JEU-Studio-Root", state["root"])',
            '        self.end_headers()',
            '        self.wfile.write(b''{"saved":true}'')',
            '    def log_message(self, format, *args): pass',
            'server = HTTPServer(("127.0.0.1", port), Handler)',
            'server.serve_forever()'
          )
          $mockFile = Join-Path $env:RUNNER_TEMP "mock_backend.py"
          Set-Content -Path $mockFile -Value ($pyCode -join "`n") -Encoding utf8
          $mockOut = Join-Path $env:RUNNER_TEMP "mock_out.txt"
          $mockErr = Join-Path $env:RUNNER_TEMP "mock_err.txt"
          $mockProc = Start-Process python `
            -ArgumentList @($mockFile, $testRoot, "$backendPort") `
            -RedirectStandardOutput $mockOut `
            -RedirectStandardError $mockErr `
            -PassThru

          Write-Host "  Waiting for mock backend to listen on port $backendPort..."
          $started = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 250
            if ($mockProc.HasExited) {
              $errContent = if (Test-Path $mockErr) { Get-Content $mockErr -Raw } else { "" }
              throw "Mock backend process exited unexpectedly with code $($mockProc.ExitCode)! Stderr: $errContent"
            }
            try {
              $client = New-Object System.Net.Sockets.TcpClient
              $client.Connect("127.0.0.1", $backendPort)
              $client.Close()
              $started = $true
              break
            } catch {
              # wait and retry
            }
          }
          if (-not $started) {
            $errContent = if (Test-Path $mockErr) { Get-Content $mockErr -Raw } else { "" }
            throw "Mock backend failed to start listening on 127.0.0.1:$backendPort within 5 seconds! Stderr: $errContent"
          }
          Write-Host "  [OK] Mock backend is listening on 127.0.0.1:$backendPort."

          Write-Host "5a. Verifying Ready Backend proxy forwarding (matching root 200)..."
          $healthReady = Invoke-RestMethod -Uri "http://127.0.0.1:$testPort/studio/health" -TimeoutSec 3 -ErrorAction Stop
          if ($healthReady.ok -ne $true -or $healthReady.backendReady -ne $true) {
            $errContent = if (Test-Path $mockErr) { Get-Content $mockErr -Raw } else { "" }
            Stop-Process -Id $mockProc.Id -Force -ErrorAction SilentlyContinue
            throw "Assertion failed: health must indicate backendReady: true when mock backend is ready! (got ok=$($healthReady.ok), backendReady=$($healthReady.backendReady), localStatus=$($healthReady.localStatus), mockStderr=$errContent)"
          }
          Write-Host "  [OK] /studio/health indicates backendReady: true."

          $apiResp = Invoke-RestMethod -Uri "http://127.0.0.1:$testPort/api/status" -TimeoutSec 3 -ErrorAction Stop
          if ($apiResp.status -ne "ready") {
            Stop-Process -Id $mockProc.Id -Force -ErrorAction SilentlyContinue
            throw "Assertion failed: proxy failed to forward /api/status!"
          }
          Write-Host "  [OK] /api/status forwarded successfully with status: ready."

          Write-Host "5b. Testing same-root 401 passthrough..."
          Invoke-WebRequest -Uri "http://127.0.0.1:$backendPort/mock/set-401" -TimeoutSec 2 -ErrorAction Stop | Out-Null
          $health401 = Invoke-RestMethod -Uri "http://127.0.0.1:$testPort/studio/health" -TimeoutSec 3 -ErrorAction Stop
          if ($health401.ok -ne $true -or $health401.backendReady -ne $true) {
            Stop-Process -Id $mockProc.Id -Force -ErrorAction SilentlyContinue
            throw "Assertion failed: health must indicate backendReady: true when mock backend returns 401 with matching root!"
          }
          $res401 = Get-HttpStatusAndBody "http://127.0.0.1:$testPort/api/status"
          if ($res401.StatusCode -ne 401 -or -not ($res401.Content -like "*unauthorized*")) {
            Stop-Process -Id $mockProc.Id -Force -ErrorAction SilentlyContinue
            throw "Expected 401 passthrough with unauthorized payload, got code $($res401.StatusCode), body: $($res401.Content)"
          }
          Write-Host "  [OK] Same-root 401 passthrough verified (HTTP 401 and payload preserved)."

          Write-Host "5c. Testing foreign root 503 without forwarding to business API..."
          Invoke-WebRequest -Uri "http://127.0.0.1:$backendPort/mock/set-foreign-root" -TimeoutSec 2 -ErrorAction Stop | Out-Null
          $bizBeforeForeign = [int](Invoke-RestMethod -Uri "http://127.0.0.1:$backendPort/mock/biz-count" -TimeoutSec 2)
          $resForeign = Get-HttpStatusAndBody "http://127.0.0.1:$testPort/api/notes"
          if ($resForeign.StatusCode -ne 503 -or -not ($resForeign.Content -like "*另一目录*")) {
            Stop-Process -Id $mockProc.Id -Force -ErrorAction SilentlyContinue
            throw "Expected 503 with '另一目录', got StatusCode $($resForeign.StatusCode), Content: $($resForeign.Content)"
          }
          $bizAfterForeign = [int](Invoke-RestMethod -Uri "http://127.0.0.1:$backendPort/mock/biz-count" -TimeoutSec 2)
          if ($bizBeforeForeign -ne $bizAfterForeign) {
            Stop-Process -Id $mockProc.Id -Force -ErrorAction SilentlyContinue
            throw "Foreign root leaked business API call to backend! (before: $bizBeforeForeign, after: $bizAfterForeign)"
          }
          if ($mockProc.HasExited) {
            throw "Mock backend process died during foreign root check!"
          }
          Write-Host "  [OK] Foreign root blocked with 503; 0 business API calls forwarded; mock process alive."

          Write-Host "5d. Testing missing root header 503 without forwarding to business API..."
          Invoke-WebRequest -Uri "http://127.0.0.1:$backendPort/mock/set-missing-root" -TimeoutSec 2 -ErrorAction Stop | Out-Null
          $bizBeforeMissing = [int](Invoke-RestMethod -Uri "http://127.0.0.1:$backendPort/mock/biz-count" -TimeoutSec 2)
          $resMissing = Get-HttpStatusAndBody "http://127.0.0.1:$testPort/api/notes"
          if ($resMissing.StatusCode -ne 503 -or -not ($resMissing.Content -like "*未携带 JEU Studio 归属标识*")) {
            Stop-Process -Id $mockProc.Id -Force -ErrorAction SilentlyContinue
            throw "Expected 503 with '未携带 JEU Studio 归属标识', got StatusCode $($resMissing.StatusCode), Content: $($resMissing.Content)"
          }
          $bizAfterMissing = [int](Invoke-RestMethod -Uri "http://127.0.0.1:$backendPort/mock/biz-count" -TimeoutSec 2)
          if ($bizBeforeMissing -ne $bizAfterMissing) {
            Stop-Process -Id $mockProc.Id -Force -ErrorAction SilentlyContinue
            throw "Missing root header leaked business API call to backend! (before: $bizBeforeMissing, after: $bizAfterMissing)"
          }
          if ($mockProc.HasExited) {
            throw "Mock backend process died during missing root check!"
          }
          Write-Host "  [OK] Missing root header blocked with 503; 0 business API calls forwarded; mock process alive."

          Write-Host "5e. Testing backend switching root blocking..."
          Invoke-WebRequest -Uri "http://127.0.0.1:$backendPort/mock/set-200" -TimeoutSec 2 -ErrorAction Stop | Out-Null
          $resValid = Invoke-RestMethod -Uri "http://127.0.0.1:$testPort/api/notes" -TimeoutSec 3 -ErrorAction Stop
          if ($resValid.status -ne "ready") {
            Stop-Process -Id $mockProc.Id -Force -ErrorAction SilentlyContinue
            throw "Failed calling /api/notes with valid matching root!"
          }
          Write-Host "  Valid request succeeded on matching root."

          Invoke-WebRequest -Uri "http://127.0.0.1:$backendPort/mock/set-foreign-root" -TimeoutSec 2 -ErrorAction Stop | Out-Null
          $resSwitched = Get-HttpStatusAndBody "http://127.0.0.1:$testPort/api/notes"
          if ($resSwitched.StatusCode -ne 503) {
            Stop-Process -Id $mockProc.Id -Force -ErrorAction SilentlyContinue
            throw "Expected 503 after backend switched root, got code $($resSwitched.StatusCode)"
          }
          Write-Host "  [OK] Backend switched root dynamically re-probed and blocked with 503."

          Write-Host "6. Security negative tests (Foreign Host, cross-site Origin, Sec-Fetch-Site: cross-site)..."
          $badHost = Get-HttpStatusAndBody "http://127.0.0.1:$testPort/studio/health" -Headers @{ "Host" = "evil.com" }
          if ($badHost.StatusCode -ne 403) {
            Stop-Process -Id $mockProc.Id -Force -ErrorAction SilentlyContinue
            throw "Host evil.com not rejected with 403! Got $($badHost.StatusCode)"
          }
          Write-Host "  [OK] Host evil.com rejected with 403 Forbidden."

          $badOrigin = Get-HttpStatusAndBody "http://127.0.0.1:$testPort/api/save" -Method "POST" -Headers @{ "Origin" = "http://evil.com" }
          if ($badOrigin.StatusCode -ne 403) {
            Stop-Process -Id $mockProc.Id -Force -ErrorAction SilentlyContinue
            throw "Mutating POST with foreign Origin not rejected with 403! Got $($badOrigin.StatusCode)"
          }
          Write-Host "  [OK] Mutating POST with foreign Origin rejected with 403 Forbidden."

          $badSecFetch = Get-HttpStatusAndBody "http://127.0.0.1:$testPort/api/save" -Method "POST" -Headers @{ "Origin" = "http://127.0.0.1:$testPort"; "Sec-Fetch-Site" = "cross-site" }
          if ($badSecFetch.StatusCode -ne 403) {
            Stop-Process -Id $mockProc.Id -Force -ErrorAction SilentlyContinue
            throw "POST with Sec-Fetch-Site: cross-site not rejected with 403! Got $($badSecFetch.StatusCode)"
          }
          Write-Host "  [OK] POST with Sec-Fetch-Site: cross-site rejected with 403 Forbidden."

          Stop-Process -Id $mockProc.Id -Force -ErrorAction SilentlyContinue

          Write-Host "7. Testing /studio/exit graceful shutdown..."
          $exitResp = Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:$testPort/studio/exit" `
            -Headers @{ "Origin" = "http://127.0.0.1:$testPort"; "X-JEU-Action" = "quit" } `
            -TimeoutSec 3 -ErrorAction Stop
          if ($exitResp.ok -ne $true) {
            throw "Expected ok: true from /studio/exit"
          }
          Write-Host "  [OK] /studio/exit returned ok: true."

          $exited = $proc.WaitForExit(5000)
          if (-not $exited) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Process did not exit after /studio/exit within 5 seconds!"
          }
          Write-Host "  [OK] Process exited cleanly with code $($proc.ExitCode)."

          Write-Host "8. Verifying zero files/directories written to test root..."
          $items = Get-ChildItem -Path $testRoot
          if ($items.Count -gt 0) {
            throw "R2a violation: files written to root directory ($($items.Name -join ', '))!"
          }
          Write-Host "  [OK] Verified zero files/directories written to test root."

      - name: Live Backend Lifecycle, Packaged Node, Same-Root Reuse, Foreign Rejection & Data Canary
        run: |
          $exePath = (Resolve-Path "rust/target/x86_64-pc-windows-msvc/release/jeu-studio-native.exe").Path

          function Get-HttpStatusAndBody($uri, $headers = @{}, $method = "GET") {
            try {
              $r = Invoke-WebRequest -Uri $uri -Method $method -Headers $headers -SkipHttpErrorCheck -TimeoutSec 3
              return @{ StatusCode = [int]$r.StatusCode; Content = $r.Content; Headers = $r.Headers }
            } catch {
              $code = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode.value__ } else { 0 }
              $body = ""
              if ($_.Exception.Response) {
                $stream = $_.Exception.Response.GetResponseStream()
                if ($stream) {
                  $reader = New-Object System.IO.StreamReader($stream)
                  $body = $reader.ReadToEnd()
                }
              }
              return @{ StatusCode = $code; Content = $body; Headers = @{} }
            }
          }

          Write-Host "================================================================="
          Write-Host "1. Testing Packaged Mode Missing Bundled Node Rejection"
          Write-Host "================================================================="
          $noNodeRoot = Join-Path $env:RUNNER_TEMP "pkg-missing-node"
          New-Item -ItemType Directory -Force -Path (Join-Path $noNodeRoot "nbl") | Out-Null
          Set-Content -Path (Join-Path $noNodeRoot "nbl\server.mjs") -Value "// stub" -Encoding utf8

          $noNodeProc = Start-Process -FilePath $exePath `
            -ArgumentList "--root", "$noNodeRoot", "--port", "9743", "--backend-port", "9543", "--no-open" `
            -PassThru
          Start-Sleep -Seconds 2

          $noNodeHealth = Invoke-RestMethod -Uri "http://127.0.0.1:9743/studio/health" -TimeoutSec 3 -ErrorAction Stop
          Write-Host "  Health status: backendReady=$($noNodeHealth.backendReady), status=$($noNodeHealth.localStatus)"
          if ($noNodeHealth.backendReady -ne $false) {
            Stop-Process -Id $noNodeProc.Id -Force -ErrorAction SilentlyContinue
            throw "Expected backendReady: false when bundled node is missing in packaged mode!"
          }
          if ($noNodeHealth.localStatus -notlike "*打包模式缺少内置 Node.js 运行时*" -or $noNodeHealth.localStatus -notlike "*禁止回退系统 Node*") {
            Stop-Process -Id $noNodeProc.Id -Force -ErrorAction SilentlyContinue
            throw "Expected missing bundled node error message, got: $($noNodeHealth.localStatus)"
          }
          Write-Host "  [OK] Missing bundled node correctly rejected without falling back to system node."
          Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:9743/studio/exit" -Headers @{ "Origin" = "http://127.0.0.1:9743"; "X-JEU-Action" = "quit" } -TimeoutSec 3 | Out-Null
          $noNodeProc.WaitForExit(3000)

          Write-Host "================================================================="
          Write-Host "2. Preparing Clean Packaged Installation Layout & Data Canaries"
          Write-Host "================================================================="
          $pkgRoot = Join-Path $env:RUNNER_TEMP "pkg-install"
          $nblDir = Join-Path $pkgRoot "nbl"
          $runtimeNodeDir = Join-Path $pkgRoot "runtime\node"
          $dataDir = Join-Path $pkgRoot "data"
          $sessionsDir = Join-Path $pkgRoot "sessions"
          $profileDir = Join-Path $sessionsDir "chrome-profile"
          $outputsDir = Join-Path $pkgRoot "outputs"

          New-Item -ItemType Directory -Force -Path $nblDir | Out-Null
          New-Item -ItemType Directory -Force -Path $runtimeNodeDir | Out-Null
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          New-Item -ItemType Directory -Force -Path $profileDir | Out-Null
          New-Item -ItemType Directory -Force -Path $outputsDir | Out-Null

          # Copy Node runtime into packaged location
          $systemNode = (Get-Command node).Source
          Write-Host "  Copying bundled Node from $systemNode to $runtimeNodeDir\node.exe..."
          Copy-Item $systemNode -Destination "$runtimeNodeDir\node.exe" -Force

          # Copy backend source & dependencies into nbl\
          Write-Host "  Copying server scripts & node_modules into $nblDir..."
          Copy-Item "server.mjs" "$nblDir\server.mjs" -Force
          Copy-Item "package.json" "$nblDir\package.json" -Force
          Copy-Item "config.json" "$nblDir\config.json" -Force
          Get-ChildItem -Filter "*.mjs" | ForEach-Object { Copy-Item $_.FullName "$nblDir\$($_.Name)" -Force }
          if (Test-Path "public") {
            robocopy "public" "$nblDir\public" /E /NFL /NDL /NJH /NJS | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "Robocopy public failed with code $LASTEXITCODE" }
            $global:LASTEXITCODE = 0
          }
          if (Test-Path "node_modules") {
            robocopy "node_modules" "$nblDir\node_modules" /E /NFL /NDL /NJH /NJS | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "Robocopy node_modules failed with code $LASTEXITCODE" }
            $global:LASTEXITCODE = 0
          }

          # Setup Data Canary files with known contents
          $canaryCfgPath = Join-Path $dataDir "config.json"
          $canaryWebcfgPath = Join-Path $dataDir "webconfig.json"
          $canarySessionPath = Join-Path $sessionsDir "session.json"
          $canaryCookiePath = Join-Path $profileDir "Cookies"
          $canaryOutputPath = Join-Path $outputsDir "sample-podcast.mp3"

          Set-Content -Path $canaryCfgPath -Value '{"port": 9540, "canaryActive": true, "userSecretToken": "SECRET_CANARY_VALUE_999"}' -Encoding utf8
          Set-Content -Path $canaryWebcfgPath -Value '{"passwordHash": "argon2id$canary$webcfg$userhash", "salt": "canary_salt_abc"}' -Encoding utf8
          Set-Content -Path $canarySessionPath -Value '{"sessionToken": "CANARY_SESSION_TOKEN_12345", "accounts": ["canary@test.local"]}' -Encoding utf8
          Set-Content -Path $canaryCookiePath -Value 'CANARY_ENCRYPTED_COOKIE_BLOB_BYTE_FOR_BYTE_RETENTION' -Encoding utf8
          Set-Content -Path $canaryOutputPath -Value 'CANARY_AUDIO_OUTPUT_MP3_STREAM_RETENTION' -Encoding utf8

          $hashCfgBefore = (Get-FileHash $canaryCfgPath -Algorithm SHA256).Hash
          $hashWebcfgBefore = (Get-FileHash $canaryWebcfgPath -Algorithm SHA256).Hash
          $hashSessionBefore = (Get-FileHash $canarySessionPath -Algorithm SHA256).Hash
          $hashCookieBefore = (Get-FileHash $canaryCookiePath -Algorithm SHA256).Hash
          $hashOutputBefore = (Get-FileHash $canaryOutputPath -Algorithm SHA256).Hash

          Write-Host "  Canary Hashes before startup:"
          Write-Host "    config.json:            $hashCfgBefore"
          Write-Host "    webconfig.json:         $hashWebcfgBefore"
          Write-Host "    sessions/session.json:  $hashSessionBefore"
          Write-Host "    chrome-profile/Cookies: $hashCookieBefore"
          Write-Host "    outputs/sample.mp3:     $hashOutputBefore"

          Write-Host "================================================================="
          Write-Host "3. Spawning Rust UI with isolated PATH and Auto-Starting Backend"
          Write-Host "================================================================="
          $rustPort = 9740
          $backendPort = 9540

          Write-Host "  Launching jeu-studio-native.exe on 127.0.0.1:$rustPort (backend port $backendPort)..."
          $startInfo = New-Object System.Diagnostics.ProcessStartInfo
          $startInfo.FileName = $exePath
          $startInfo.Arguments = "--root `"$pkgRoot`" --port $rustPort --backend-port $backendPort --no-open"
          $startInfo.Environment["PATH"] = "C:\Windows\System32;C:\Windows"
          $startInfo.UseShellExecute = $false
          $rustProc = [System.Diagnostics.Process]::Start($startInfo)

          Write-Host "  Rust UI PID: $($rustProc.Id)"

          Write-Host "  Waiting for backend auto-spawn and binding on port $backendPort..."
          $ready = $false
          $healthData = $null
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $healthData = Invoke-RestMethod -Uri "http://127.0.0.1:$rustPort/studio/health" -TimeoutSec 3 -ErrorAction Stop
              if ($healthData.ok -eq $true -and $healthData.backendReady -eq $true) {
                $ready = $true
                break
              }
            } catch {
              # wait and retry
            }
          }

          if (-not $ready) {
            $logPath = Join-Path $dataDir "local-server.log"
            $logContent = if (Test-Path $logPath) { Get-Content $logPath -Raw } else { "No log file found" }
            Stop-Process -Id $rustProc.Id -Force -ErrorAction SilentlyContinue
            throw "Backend failed to become ready within 15 seconds! Health: $($healthData | ConvertTo-Json -Compress). Log: $logContent"
          }
          Write-Host "  [OK] /studio/health reports backendReady: true, localStatus: $($healthData.localStatus)"

          Write-Host "================================================================="
          Write-Host "4. Verifying PID File Contract & STOP_LOCAL.ps1 Compatibility"
          Write-Host "================================================================="
          $pidFile = Join-Path $dataDir "local-server.pid.json"
          if (-not (Test-Path $pidFile)) {
            Stop-Process -Id $rustProc.Id -Force -ErrorAction SilentlyContinue
            throw "Expected PID file $pidFile does not exist!"
          }
          $pidContent = Get-Content $pidFile -Raw
          Write-Host "  PID file content: $pidContent"
          $pidJson = $pidContent | ConvertFrom-Json
          $backendPid = [int]$pidJson.pid
          if ($backendPid -le 0) {
            throw "Invalid PID in PID file: $backendPid"
          }
          if ($pidJson.script -notlike "*nbl\server.mjs*") {
            throw "Script in PID file does not point to nbl\server.mjs: $($pidJson.script)"
          }
          $startedTime = [DateTime]::Parse($pidJson.startedAt).ToUniversalTime()
          Write-Host "  Parsed startedAt: $($startedTime.ToString('o'))"

          $nodeProc = Get-Process -Id $backendPid -ErrorAction SilentlyContinue
          if (-not $nodeProc -or $nodeProc.HasExited) {
            throw "Backend process PID $backendPid is not running!"
          }
          Write-Host "  [OK] Backend Node process PID $backendPid is running ($($nodeProc.ProcessName))."

          Write-Host "================================================================="
          Write-Host "5. Verifying Unauthenticated 401 Passthrough with Ownership Header"
          Write-Host "================================================================="
          $apiResp = Get-HttpStatusAndBody "http://127.0.0.1:$rustPort/api/status"
          if ($apiResp.StatusCode -ne 401) {
            throw "Expected HTTP 401 Unauthorized from /api/status, got $($apiResp.StatusCode)"
          }
          $headerRoot = $apiResp.Headers["X-JEU-Studio-Root"]
          if ($headerRoot.TrimEnd('\/').ToLower() -ne $pkgRoot.TrimEnd('\/').ToLower()) {
            throw "Mismatched X-JEU-Studio-Root: expected $pkgRoot, got $headerRoot"
          }
          if ($apiResp.Content -notlike "*未登录*" -and $apiResp.Content -notlike "*authenticated*") {
            throw "Expected JSON auth payload in 401 response: $($apiResp.Content)"
          }
          Write-Host "  [OK] /api/status passed through 401 with matching X-JEU-Studio-Root: $headerRoot"

          Write-Host "================================================================="
          Write-Host "6. Verifying Data Canary Preservation (Zero Overwrite / Truncation)"
          Write-Host "================================================================="
          $hashCfgAfter = (Get-FileHash $canaryCfgPath -Algorithm SHA256).Hash
          $hashWebcfgAfter = (Get-FileHash $canaryWebcfgPath -Algorithm SHA256).Hash
          $hashSessionAfter = (Get-FileHash $canarySessionPath -Algorithm SHA256).Hash
          $hashCookieAfter = (Get-FileHash $canaryCookiePath -Algorithm SHA256).Hash
          $hashOutputAfter = (Get-FileHash $canaryOutputPath -Algorithm SHA256).Hash

          if ($hashCfgAfter -ne $hashCfgBefore) {
            throw "Data Canary Violation: data/config.json was modified! Before: $hashCfgBefore, After: $hashCfgAfter"
          }
          if ($hashWebcfgAfter -ne $hashWebcfgBefore) {
            throw "Data Canary Violation: data/webconfig.json was modified! Before: $hashWebcfgBefore, After: $hashWebcfgAfter"
          }
          if ($hashSessionAfter -ne $hashSessionBefore) {
            throw "Data Canary Violation: sessions/session.json was modified! Before: $hashSessionBefore, After: $hashSessionAfter"
          }
          if ($hashCookieAfter -ne $hashCookieBefore) {
            throw "Data Canary Violation: sessions/chrome-profile/Cookies was modified! Before: $hashCookieBefore, After: $hashCookieAfter"
          }
          if ($hashOutputAfter -ne $hashOutputBefore) {
            throw "Data Canary Violation: outputs/sample.mp3 was modified! Before: $hashOutputBefore, After: $hashOutputAfter"
          }
          Write-Host "  [OK] All 5 data canary files preserved byte-for-byte with identical SHA256."

          Write-Host "================================================================="
          Write-Host "7. Verifying Same-Directory Backend Reuse (Zero Duplicate Process)"
          Write-Host "================================================================="
          $rustProc2 = Start-Process -FilePath $exePath `
            -ArgumentList "--root", "$pkgRoot", "--port", "9741", "--backend-port", "$backendPort", "--no-open" `
            -PassThru
          Start-Sleep -Seconds 2

          $health2 = Invoke-RestMethod -Uri "http://127.0.0.1:9741/studio/health" -TimeoutSec 3 -ErrorAction Stop
          Write-Host "  Second instance health: backendReady=$($health2.backendReady), status=$($health2.localStatus)"
          if ($health2.backendReady -ne $true -or $health2.localStatus -notlike "*现有本机 NBL 服务已运行*") {
            Stop-Process -Id $rustProc2.Id -Force -ErrorAction SilentlyContinue
            throw "Second instance failed to reuse existing backend!"
          }

          # Verify no second node process was spawned
          $allNodeProcs = Get-Process -Name "node" -ErrorAction SilentlyContinue
          Write-Host "  Total Node processes active: $($allNodeProcs.Count)"
          $matchingNodeProcs = @($allNodeProcs | Where-Object { $_.Id -eq $backendPid })
          if ($matchingNodeProcs.Count -ne 1) {
            Stop-Process -Id $rustProc2.Id -Force -ErrorAction SilentlyContinue
            throw "Expected exactly 1 Node process with PID $backendPid, found $($matchingNodeProcs.Count)!"
          }
          Write-Host "  [OK] Reused existing backend PID $backendPid without spawning duplicate process."

          # Cleanly exit second instance
          Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:9741/studio/exit" `
            -Headers @{ "Origin" = "http://127.0.0.1:9741"; "X-JEU-Action" = "quit" } `
            -TimeoutSec 3 | Out-Null
          $rustProc2.WaitForExit(3000)

          Write-Host "================================================================="
          Write-Host "8. Verifying Foreign Directory Rejection & 503 Interception"
          Write-Host "================================================================="
          $foreignRoot = Join-Path $env:RUNNER_TEMP "foreign-install"
          New-Item -ItemType Directory -Force -Path $foreignRoot | Out-Null

          $rustProc3 = Start-Process -FilePath $exePath `
            -ArgumentList "--root", "$foreignRoot", "--port", "9742", "--backend-port", "$backendPort", "--no-backend", "--no-open" `
            -PassThru
          Start-Sleep -Seconds 2

          $foreignHealth = Invoke-RestMethod -Uri "http://127.0.0.1:9742/studio/health" -TimeoutSec 3 -ErrorAction Stop
          Write-Host "  Foreign instance health: backendReady=$($foreignHealth.backendReady), status=$($foreignHealth.localStatus)"
          if ($foreignHealth.backendReady -ne $false) {
            Stop-Process -Id $rustProc3.Id -Force -ErrorAction SilentlyContinue
            throw "Foreign root should report backendReady: false!"
          }
          if ($foreignHealth.localStatus -notlike "*另一目录*") {
            Stop-Process -Id $rustProc3.Id -Force -ErrorAction SilentlyContinue
            throw "Expected '另一目录' in foreign localStatus, got: $($foreignHealth.localStatus)"
          }

          # Probing /api/status through foreign instance should return 503
          $foreignApi = Get-HttpStatusAndBody "http://127.0.0.1:9742/api/status"
          if ($foreignApi.StatusCode -ne 503) {
            Stop-Process -Id $rustProc3.Id -Force -ErrorAction SilentlyContinue
            throw "Expected HTTP 503 for foreign root API request, got $($foreignApi.StatusCode)"
          }
          Write-Host "  [OK] Foreign instance blocked /api/status with HTTP 503."

          # Verify original backend was NOT killed
          $nodeStillAlive = Get-Process -Id $backendPid -ErrorAction SilentlyContinue
          if (-not $nodeStillAlive -or $nodeStillAlive.HasExited) {
            Stop-Process -Id $rustProc3.Id -Force -ErrorAction SilentlyContinue
            throw "Backend PID $backendPid was killed by foreign instance!"
          }
          Write-Host "  [OK] Original backend PID $backendPid remained alive and untouched."

          # Exit third instance
          Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:9742/studio/exit" `
            -Headers @{ "Origin" = "http://127.0.0.1:9742"; "X-JEU-Action" = "quit" } `
            -TimeoutSec 3 | Out-Null
          $rustProc3.WaitForExit(3000)

          Write-Host "================================================================="
          Write-Host "9. Verifying /studio/exit Leaves Backend Node Service Running"
          Write-Host "================================================================="
          Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:$rustPort/studio/exit" `
            -Headers @{ "Origin" = "http://127.0.0.1:$rustPort"; "X-JEU-Action" = "quit" } `
            -TimeoutSec 3 | Out-Null

          $rustExited = $rustProc.WaitForExit(5000)
          if (-not $rustExited) {
            Stop-Process -Id $rustProc.Id -Force -ErrorAction SilentlyContinue
            throw "Rust UI process did not exit within 5 seconds!"
          }
          Write-Host "  [OK] Rust UI process exited with code $($rustProc.ExitCode)."

          # Backend Node process must STILL be running!
          $nodeRunningAfterExit = Get-Process -Id $backendPid -ErrorAction SilentlyContinue
          if (-not $nodeRunningAfterExit -or $nodeRunningAfterExit.HasExited) {
            throw "Backend Node process died after Rust UI exit!"
          }
          Write-Host "  [OK] Backend Node process PID $backendPid is STILL RUNNING as background service."
          if (-not (Test-Path $pidFile)) {
            throw "PID file was deleted after normal Rust UI exit!"
          }
          Write-Host "  [OK] PID file $pidFile preserved."

          Write-Host "================================================================="
          Write-Host "10. Precise Process Cleanup by Recorded PID"
          Write-Host "================================================================="
          Stop-Process -Id $backendPid -Force -ErrorAction SilentlyContinue
          Start-Sleep -Milliseconds 500
          $nodeDead = Get-Process -Id $backendPid -ErrorAction SilentlyContinue
          if ($nodeDead) {
            throw "Failed to stop backend PID $backendPid!"
          }
          Remove-Item $pidFile -Force -ErrorAction SilentlyContinue
          Write-Host "  [OK] Backend process PID $backendPid precisely cleaned up."

          Write-Host "================================================================="
          Write-Host "11. Negative Test: Non-HTTP Listener (Junk Protocol)"
          Write-Host "================================================================="
          $nonHttpPort = 9545
          $rustNonHttpPort = 9745
          $pyNonHttpCode = @(
            'import socket, sys',
            's = socket.socket(socket.AF_INET, socket.SOCK_STREAM)',
            's.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)',
            "s.bind(('127.0.0.1', $nonHttpPort))",
            's.listen(5)',
            'print("LISTENING")',
            'sys.stdout.flush()',
            'while True:',
            '    try:',
            '        conn, addr = s.accept()',
            '        conn.sendall(b"RAW_NON_HTTP_JUNK_PROTOCOL\r\n\r\n")',
            '        conn.close()',
            '    except:',
            '        break'
          ) -join "`n"
          $nonHttpPyFile = Join-Path $env:RUNNER_TEMP "mock_non_http.py"
          Set-Content -Path $nonHttpPyFile -Value $pyNonHttpCode -Encoding utf8
          $nonHttpProc = Start-Process python -ArgumentList @($nonHttpPyFile) -PassThru
          Start-Sleep -Seconds 1

          $rustNonHttp = Start-Process -FilePath $exePath `
            -ArgumentList "--root", "$pkgRoot", "--port", "$rustNonHttpPort", "--backend-port", "$nonHttpPort", "--no-backend", "--no-open" `
            -PassThru
          Start-Sleep -Seconds 2

          # Health must report backendReady: false and conflicting/non-HTTP status
          $healthNonHttp = Invoke-RestMethod -Uri "http://127.0.0.1:$rustNonHttpPort/studio/health" -TimeoutSec 3 -ErrorAction Stop
          Write-Host "  Non-HTTP health: backendReady=$($healthNonHttp.backendReady), status=$($healthNonHttp.localStatus)"
          if ($healthNonHttp.backendReady -ne $false) {
            throw "Expected backendReady: false for non-HTTP backend port!"
          }
          if ($healthNonHttp.localStatus -notlike "*非 HTTP*" -and $healthNonHttp.localStatus -notlike "*异常服务*") {
            throw "Expected non-HTTP diagnostic message, got: $($healthNonHttp.localStatus)"
          }

          # API must be blocked with 503
          $apiNonHttp = Get-HttpStatusAndBody "http://127.0.0.1:$rustNonHttpPort/api/status"
          if ($apiNonHttp.StatusCode -ne 503) {
            throw "Expected HTTP 503 for non-HTTP backend, got $($apiNonHttp.StatusCode)"
          }
          Write-Host "  [OK] /api/status blocked with HTTP 503 on non-HTTP listener."

          # External listener must STILL be alive
          if ($nonHttpProc.HasExited) {
            throw "External non-HTTP listener process was killed!"
          }
          Write-Host "  [OK] External non-HTTP listener remains alive and untouched."

          # Clean up
          Stop-Process -Id $nonHttpProc.Id -Force -ErrorAction SilentlyContinue
          Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:$rustNonHttpPort/studio/exit" -Headers @{ "Origin" = "http://127.0.0.1:$rustNonHttpPort"; "X-JEU-Action" = "quit" } -TimeoutSec 3 | Out-Null
          $rustNonHttp.WaitForExit(3000)

          Write-Host "================================================================="
          Write-Host "12. Negative Test: Blackhole Timeout (Hangs on Connection)"
          Write-Host "================================================================="
          $blackholePort = 9546
          $rustBlackholePort = 9746
          $pyBlackholeCode = @(
            'import socket, sys, time',
            's = socket.socket(socket.AF_INET, socket.SOCK_STREAM)',
            's.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)',
            "s.bind(('127.0.0.1', $blackholePort))",
            's.listen(5)',
            'print("LISTENING")',
            'sys.stdout.flush()',
            'while True:',
            '    try:',
            '        conn, addr = s.accept()',
            '        time.sleep(10)',
            '        conn.close()',
            '    except:',
            '        break'
          ) -join "`n"
          $blackholePyFile = Join-Path $env:RUNNER_TEMP "mock_blackhole.py"
          Set-Content -Path $blackholePyFile -Value $pyBlackholeCode -Encoding utf8
          $blackholeProc = Start-Process python -ArgumentList @($blackholePyFile) -PassThru
          Start-Sleep -Seconds 1

          $rustBlackhole = Start-Process -FilePath $exePath `
            -ArgumentList "--root", "$pkgRoot", "--port", "$rustBlackholePort", "--backend-port", "$blackholePort", "--no-backend", "--no-open" `
            -PassThru
          Start-Sleep -Seconds 3

          # Health must report backendReady: false with timeout diagnostic
          $healthBlackhole = Invoke-RestMethod -Uri "http://127.0.0.1:$rustBlackholePort/studio/health" -TimeoutSec 5 -ErrorAction Stop
          Write-Host "  Blackhole health: backendReady=$($healthBlackhole.backendReady), status=$($healthBlackhole.localStatus)"
          if ($healthBlackhole.backendReady -ne $false) {
            throw "Expected backendReady: false for blackhole backend port!"
          }
          if ($healthBlackhole.localStatus -notlike "*请求超时*" -and $healthBlackhole.localStatus -notlike "*超时*") {
            throw "Expected timeout diagnostic message, got: $($healthBlackhole.localStatus)"
          }

          # API must be blocked with 503
          $apiBlackhole = Get-HttpStatusAndBody "http://127.0.0.1:$rustBlackholePort/api/status"
          if ($apiBlackhole.StatusCode -ne 503) {
            throw "Expected HTTP 503 for blackhole backend, got $($apiBlackhole.StatusCode)"
          }
          Write-Host "  [OK] /api/status blocked with HTTP 503 on blackhole listener."

          # External listener must STILL be alive
          if ($blackholeProc.HasExited) {
            throw "External blackhole listener process was killed!"
          }
          Write-Host "  [OK] External blackhole listener remains alive and untouched."

          # Clean up
          Stop-Process -Id $blackholeProc.Id -Force -ErrorAction SilentlyContinue
          Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:$rustBlackholePort/studio/exit" -Headers @{ "Origin" = "http://127.0.0.1:$rustBlackholePort"; "X-JEU-Action" = "quit" } -TimeoutSec 3 | Out-Null
          $rustBlackhole.WaitForExit(3000)

          Write-Host "================================================================="
          Write-Host "13. Negative Test: Child Premature Exit & Cleanup"
          Write-Host "================================================================="
          $earlyExitRoot = Join-Path $env:RUNNER_TEMP "child-early-exit-root"
          $earlyNbl = Join-Path $earlyExitRoot "nbl"
          $earlyNode = Join-Path $earlyExitRoot "runtime\node"
          New-Item -ItemType Directory -Force -Path $earlyNbl | Out-Null
          New-Item -ItemType Directory -Force -Path $earlyNode | Out-Null
          Copy-Item $systemNode -Destination "$earlyNode\node.exe" -Force
          Copy-Item "package.json" "$earlyNbl\package.json" -Force
          Copy-Item "config.json" "$earlyNbl\config.json" -Force
          Set-Content -Path (Join-Path $earlyNbl "server.mjs") -Value "console.error('Fatal crash on startup'); process.exit(42);" -Encoding utf8

          $earlyExitPort = 9747
          $earlyBackendPort = 9547
          $rustEarlyExit = Start-Process -FilePath $exePath `
            -ArgumentList "--root", "$earlyExitRoot", "--port", "$earlyExitPort", "--backend-port", "$earlyBackendPort", "--no-open" `
            -PassThru
          Start-Sleep -Seconds 3

          $healthEarlyExit = Invoke-RestMethod -Uri "http://127.0.0.1:$earlyExitPort/studio/health" -TimeoutSec 3 -ErrorAction Stop
          Write-Host "  Early exit health: backendReady=$($healthEarlyExit.backendReady), status=$($healthEarlyExit.localStatus)"
          if ($healthEarlyExit.backendReady -ne $false) {
            throw "Expected backendReady: false when child exited prematurely!"
          }
          if ($healthEarlyExit.localStatus -notlike "*启动后异常退出*") {
            throw "Expected '启动后异常退出' in localStatus, got: $($healthEarlyExit.localStatus)"
          }

          # Verify PID file was cleaned up
          $earlyPidFile = Join-Path $earlyExitRoot "data\local-server.pid.json"
          if (Test-Path $earlyPidFile) {
            throw "PID file was not cleaned up after child early exit!"
          }
          Write-Host "  [OK] Child early exit handled, PID file cleaned up, health reports failure."

          # Clean up
          Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:$earlyExitPort/studio/exit" -Headers @{ "Origin" = "http://127.0.0.1:$earlyExitPort"; "X-JEU-Action" = "quit" } -TimeoutSec 3 | Out-Null
          $rustEarlyExit.WaitForExit(3000)

          Write-Host "================================================================="
          Write-Host "14. Negative Test: Foreign Root Occupancy & Competitor Port Race"
          Write-Host "================================================================="
          $competitorPort = 9548
          $rustCompetitorPort = 9748
          # Start a mock backend on $competitorPort with foreign root
          $pyCompetitorCode = @(
            'from http.server import HTTPServer, BaseHTTPRequestHandler',
            'class H(BaseHTTPRequestHandler):',
            '    def do_GET(self):',
            '        self.send_response(200)',
            '        self.send_header("Content-Type", "application/json")',
            '        self.send_header("X-JEU-Studio-Root", "C:\\Other\\ForeignRoot")',
            '        self.end_headers()',
            '        self.wfile.write(b''{"status":"ready"}'')',
            '    def log_message(self, format, *args): pass',
            "s = HTTPServer(('127.0.0.1', $competitorPort), H)",
            's.serve_forever()'
          ) -join "`n"
          $competitorPyFile = Join-Path $env:RUNNER_TEMP "mock_competitor.py"
          Set-Content -Path $competitorPyFile -Value $pyCompetitorCode -Encoding utf8
          $competitorProc = Start-Process python -ArgumentList @($competitorPyFile) -PassThru
          Start-Sleep -Seconds 1

          $rustCompetitor = Start-Process -FilePath $exePath `
            -ArgumentList "--root", "$pkgRoot", "--port", "$rustCompetitorPort", "--backend-port", "$competitorPort", "--no-open" `
            -PassThru
          Start-Sleep -Seconds 2

          # Verify Rust UI refuses to reuse foreign backend
          $healthCompetitor = Invoke-RestMethod -Uri "http://127.0.0.1:$rustCompetitorPort/studio/health" -TimeoutSec 3 -ErrorAction Stop
          Write-Host "  Competitor health: backendReady=$($healthCompetitor.backendReady), status=$($healthCompetitor.localStatus)"
          if ($healthCompetitor.backendReady -ne $false) {
            throw "Expected backendReady: false when port is occupied by foreign root competitor!"
          }
          if ($healthCompetitor.localStatus -notlike "*另一目录*") {
            throw "Expected '另一目录' in localStatus, got: $($healthCompetitor.localStatus)"
          }

          # Competitor process must NOT be killed
          if ($competitorProc.HasExited) {
            throw "Competitor process was killed by Rust UI!"
          }
          Write-Host "  [OK] Competitor process remains alive, Rust UI refused to hijack or kill."

          # Clean up
          Stop-Process -Id $competitorProc.Id -Force -ErrorAction SilentlyContinue
          Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:$rustCompetitorPort/studio/exit" -Headers @{ "Origin" = "http://127.0.0.1:$rustCompetitorPort"; "X-JEU-Action" = "quit" } -TimeoutSec 3 | Out-Null
          $rustCompetitor.WaitForExit(3000)

          Write-Host "================================================================="
          Write-Host "All Windows CI integration tests passed successfully!"
          Write-Host "================================================================="
          $global:LASTEXITCODE = 0
          exit 0
